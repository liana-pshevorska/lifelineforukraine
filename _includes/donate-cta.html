<section class="cta">
  <div class="wrap wrap--narrow cta__inner">
    <h2 class="cta__title">{{ include.title | default: "Send the next kit" }}</h2>
    <p class="cta__text">
      {{ include.text | default: "Every donation buys a specific thing a medic asked for." }}
    </p>
    <a class="btn btn--donate btn--lg" href="{{ '/donate/' | relative_url }}">Donate now</a>
  </div>
</section>
