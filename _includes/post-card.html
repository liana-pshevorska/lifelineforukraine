<article class="post-card">
  {% if include.post.image %}
  <a class="post-card__media" href="{{ include.post.url | relative_url }}" tabindex="-1" aria-hidden="true">
    <img src="{{ include.post.image | relative_url }}" alt="" loading="lazy">
  </a>
  {% endif %}
  <div class="post-card__body">
    <p class="post-card__date">
      <time datetime="{{ include.post.date | date_to_xmlschema }}">
        {{ include.post.date | date: "%B %-d, %Y" }}
      </time>
      {% if include.post.location %}<span class="post-card__loc">{{ include.post.location }}</span>{% endif %}
    </p>
    <h3 class="post-card__title">
      <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
    </h3>
    <p class="post-card__excerpt">
      {{ include.post.excerpt | default: include.post.content | strip_html | truncate: 180 }}
    </p>
    <p class="post-card__more"><a href="{{ include.post.url | relative_url }}">Read the update <span aria-hidden="true">&rarr;</span></a></p>
  </div>
</article>
