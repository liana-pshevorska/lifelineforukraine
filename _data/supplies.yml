# The full supply ledger, published verbatim on the About page.
#
# This is deliberately the whole table rather than a selection of the impressive
# rows. The unglamorous entries are the point: an organization that reports
# 24 compression bandages and a refund from 2023 is visibly keeping real books,
# and that is worth more than a rounder number.
#
# Rules for editing:
#   - Keep the "~" on approximate counts. Do not tidy them into round numbers.
#   - Keep `note` honest, including when it records something that went wrong.
#   - Update `as_of` in _data/impact.yml whenever this changes.
#
# `headline` promotes a row into the three-figure band on the homepage. The band
# reads its numbers from here rather than keeping its own copy, so the public
# totals cannot drift apart from the ledger.

- item: "Israeli / trauma bandages"
  total: "~726"
  headline:
