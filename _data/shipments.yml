# ledger onward. Everything before that was Liana raising money among friends,
# before the organization existed.
#
# WHY THIS LISTS ONLY MEDICAL SUPPLIES: the source ledger is a personal document
# and records Liana's own spending alongside the organization's — sleeping bags,
# food and similar were bought with her own money and simply kept in the same
# running total. Donated funds buy medical supplies only, which is what makes the
# "100% of donations are spent on medical aid" claim on the site true. Do not add
# lines here from the source ledger without checking which pot paid for them.
