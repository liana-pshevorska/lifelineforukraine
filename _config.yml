# ─── Site identity ───────────────────────────────────────────────────────────
title: Lifeline for Ukraine
tagline: Critical medical supplies for communities impacted by the Russian-Ukrainian war
description: >-
  Lifeline for Ukraine Inc. is a 501(c)(3) non-profit that delivers Individual First Aid
  Kits, tourniquets, and blood-clotting gauze to trusted partners in Ukraine.
  100% of donations are spent on medical aid.

# Set this to your final address once the domain is live, e.g. https://lifelineforukraine.org
# GitHub Pages fills it in automatically if you leave it blank.
url: ""
baseurl: ""

# ─── Organization details (used across the site — edit here, nowhere else) ───
org:
  legal_name: Lifeline for Ukraine Inc.
  ein: 99-2880632
  street: 16 Duffield Dr
  city: West Hartford
  state: Connecticut
  zip: 06107-1213
  country: United States
  phone: "617-528-8670"
  phone_link: "+16175288670"
  email: "lifelineforukraine@gmail.com"

# ─── Donations ───────────────────────────────────────────────────────────────
donate:
  # Which online provider the donate page offers: zeffy | paypal | none
  #
  # zeffy  — takes no platform fee and no processing fee, which is what makes the
  #          "100% of donations are spent on medical aid" claim literally true.
  #          Zeffy stays free by asking donors for an optional contribution to Zeffy
  #          at checkout, separate from the gift to us.
  # paypal — kept working as an alternative. PayPal's confirmed-charity rate is
  #          1.99% + $0.49 per donation, so a $35 gift arrives as $33.81. Switching
  #          to this means the 100% wording on the site needs a caveat.
  # none   — the card is replaced by an honest notice pointing donors at Zelle.
  provider: zeffy

  # The organization's Zeffy donation form. Verified live, with one-time and monthly
  # options. If it ever changes, this is the only place it needs updating.
  zeffy_url: "https://www.zeffy.com/en-US/donation-form/lifeline-for-ukraine"

  # Only used when provider is "paypal". Get the hosted button ID from
  # PayPal → Pay & Get Paid → PayPal Buttons → Donate, and enable recurring there.
  # Never put a bare https://www.paypal.com/donate in paypal_url: that is PayPal's
  # generic donation page and cannot route a cent to this organization.
  paypal_button_id: ""
  paypal_url: ""

  # Zelle: no fees at all, but no web integration either — it lives in bank apps.
  zelle_tag: "lifelineforukraine"
  zelle_qr: "/assets/img/zelle-qr.png"
  # The Zelle-enrolled address, confirmed in the bank app.
  zelle_email: "lifelineforukraine@gmail.com"

# ─── Social (leave blank to hide the link) ───────────────────────────────────
social:
  facebook: ""
  instagram: ""
  x: ""
  linkedin: ""

# ─── Build ───────────────────────────────────────────────────────────────────
permalink: /updates/:year/:month/:day/:title/
timezone: America/New_York

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

defaults:
  # `image` is the social preview card. A post that sets its own `image:` in front
  # matter overrides it, so update photos win over the generic card.
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "" }
    values: { layout: "page", image: "/assets/img/og-image.png" }

exclude:
  # The master logo artwork is version-controlled but never published: every asset
  # the site serves is derived from assets/img/logo.svg, not from this file.
  - assets/img/source
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - POSTING.md
  - .claude
