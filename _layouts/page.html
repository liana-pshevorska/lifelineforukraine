---
layout: default
---
<article class="page">
  <header class="page__header">
    <div class="wrap wrap--narrow">
      <h1 class="page__title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page__subtitle">{{ page.subtitle }}</p>{% endif %}
    </div>
  </header>
  <div class="wrap wrap--narrow prose">
    {{ content }}
  </div>
</article>
